# GitHub Actions workflow for Hybrid-Cloud SCM Hub.
# Performs automated builds and tests for both Backend (Java/Maven) and Frontend (Angular/npm).
# Additionally builds Docker images for both services upon successful verification on the main branch.
name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and Test with Maven
        working-directory: backend
        run: mvn test

  frontend-build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Frontend
        working-directory: frontend
        run: npm run build

      - name: Run Frontend Tests (Headless)
        working-directory: frontend
        run: npm test -- --watch=false --browsers=ChromeHeadless

  docker-images:
    needs: [backend-build-test, frontend-build-test]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Image
        uses: docker/build-push-action@v5
        with:
          context: backend
          push: false
          tags: scm-hub-backend:latest

      - name: Build Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: frontend
          push: false
          tags: scm-hub-frontend:latest
