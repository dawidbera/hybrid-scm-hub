# Docker Compose file to orchestrate the infrastructure for Hybrid-Cloud SCM Hub.
# This setup provides two PostgreSQL instances to simulate a hybrid IT landscape.

services:
  # On-Premise Database instance.
  postgres-onprem:
    image: postgres:15
    container_name: scm-onprem-db
    environment:
      POSTGRES_DB: scm_onprem
      POSTGRES_USER: scm_user
      POSTGRES_PASSWORD: scm_password
    ports:
      - "5432:5432"

  # Cloud Simulation Database instance.
  postgres-cloud:
    image: postgres:15
    container_name: scm-cloud-db
    environment:
      POSTGRES_DB: scm_cloud
      POSTGRES_USER: scm_user
      POSTGRES_PASSWORD: scm_password
    ports:
      - "5433:5432"

  # Cloud service simulation (S3, SQS).
  localstack:
    image: localstack/localstack:3.4.0
    container_name: scm-localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3,sqs
      - DEFAULT_REGION=us-east-1
      - DEBUG=1
      - ACTIVATE_PRO=0
    volumes:
      - "./localstack-init:/etc/localstack/init/ready.d"

  # Backend application service.
  backend:
    build: ./backend
    container_name: scm-hub-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_ONPREM_URL=jdbc:postgresql://postgres-onprem:5432/scm_onprem
      - SPRING_DATASOURCE_CLOUD_URL=jdbc:postgresql://postgres-cloud:5432/scm_cloud
      - SPRING_SQL_INIT_MODE=always
      - AWS_ENDPOINT_URL=http://localstack:4566
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
    depends_on:
      - postgres-onprem
      - postgres-cloud
      - localstack

  # Frontend application service.
  frontend:
    build: ./frontend
    container_name: scm-hub-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
