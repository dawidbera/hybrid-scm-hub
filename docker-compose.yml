# Docker Compose file to orchestrate the infrastructure for Hybrid-Cloud SCM Hub.
# This setup provides two PostgreSQL instances to simulate a hybrid IT landscape.

services:
  # On-Premise Database instance.
  postgres-onprem:
    image: postgres:15
    container_name: scm-onprem-db
    environment:
      POSTGRES_DB: scm_onprem
      POSTGRES_USER: scm_user
      POSTGRES_PASSWORD: scm_password
    ports:
      - "5432:5432"

  # Cloud Simulation Database instance.
  postgres-cloud:
    image: postgres:15
    container_name: scm-cloud-db
    environment:
      POSTGRES_DB: scm_cloud
      POSTGRES_USER: scm_user
      POSTGRES_PASSWORD: scm_password
    ports:
      - "5433:5432"

  # Backend application service.
  backend:
    build: ./backend
    container_name: scm-hub-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_ONPREM_URL=jdbc:postgresql://postgres-onprem:5432/scm_onprem
      - SPRING_DATASOURCE_CLOUD_URL=jdbc:postgresql://postgres-cloud:5432/scm_cloud
    depends_on:
      - postgres-onprem
      - postgres-cloud

  # Frontend application service.
  frontend:
    build: ./frontend
    container_name: scm-hub-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
