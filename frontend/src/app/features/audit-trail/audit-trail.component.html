<div class="audit-trail-container">
  <h2>Synchronization Audit Trail</h2>
  <div class="table-wrapper">
    <table>
      <thead>
        <tr>
          <th>Entity</th>
          <th>Entity ID</th>
          <th>Status</th>
          <th>Sync Details</th>
          <th>Timestamp</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let log of auditLogs" [class.error-row]="log.status === 'FAILURE'">
          <td><strong>{{ log.entityName }}</strong></td>
          <td class="id-cell">{{ log.entityId }}</td>
          <td>
            <span class="status-badge" [attr.data-status]="log.status">
              {{ log.status }}
            </span>
          </td>
          <td class="error-cell">
            <span *ngIf="log.status === 'FAILURE'" class="error-text">
              {{ log.errorMessage }}
            </span>
            <span *ngIf="log.status === 'SUCCESS'" class="success-text">
              Synced Successfully
            </span>
            <span *ngIf="log.status === 'PENDING'">
              Waiting for Sync...
            </span>
          </td>
          <td>{{ log.syncTimestamp | date:'medium' }}</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
