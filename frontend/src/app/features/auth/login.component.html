<div class="login-page">
  <div class="login-card">
    <div class="login-header">
      <div class="logo-placeholder">
        <i class="scm-icon">SCM</i>
      </div>
      <h2>Hybrid SCM Hub</h2>
      <p>Sign in to manage your supply chain</p>
    </div>

    <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
      <div class="form-group">
        <label for="username">Username</label>
        <div class="input-wrapper">
          <input
            id="username"
            [(ngModel)]="username"
            name="username"
            required
            type="text"
            placeholder="Enter your username">
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrapper">
          <input
            id="password"
            [(ngModel)]="password"
            name="password"
            required
            type="password"
            placeholder="Enter your password">
        </div>
      </div>

      <div *ngIf="error" class="error-message">
        {{ error }}
      </div>

      <button type="submit" [disabled]="!loginForm.valid" class="login-button">
        Login to Dashboard
      </button>
    </form>
    
    <div class="login-footer">
      <p>&copy; 2026 Hybrid SCM Hub. All rights reserved.</p>
    </div>
  </div>
</div>
