<div class="dashboard-container">
  <header>
    <h1>Hybrid-Cloud SCM Dashboard</h1>
    <div class="status-badge" [class.online]="true">Live Updates Connected</div>
  </header>

  <main>
    <section class="warehouse-selector">
      <h3>Select Warehouse</h3>
      <div class="warehouse-grid">
        <div *ngFor="let w of warehouses" 
             class="warehouse-card" 
             (click)="onWarehouseSelect(w.id!)">
          <h4>{{w.name}}</h4>
          <p>{{w.location}}</p>
        </div>
      </div>
    </section>

    <section class="stock-display" *ngIf="selectedWarehouseStocks.length > 0">
      <h3>Stock Levels</h3>
      <table>
        <thead>
          <tr>
            <th>Product ID</th>
            <th>Quantity</th>
            <th>Last Updated</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let s of selectedWarehouseStocks" class="stock-row">
            <td>{{s.productId}}</td>
            <td>
              <span class="quantity-badge" [class.low]="s.quantity < 10">
                {{s.quantity}}
              </span>
            </td>
            <td>{{s.lastUpdated | date:'medium'}}</td>
          </tr>
        </tbody>
      </table>
    </section>
  </main>
</div>
