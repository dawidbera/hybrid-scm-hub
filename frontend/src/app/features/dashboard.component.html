<div class="dashboard-container">
  <header>
    <h1>Hybrid-Cloud SCM Dashboard</h1>
    <div class="status-badge" [class.online]="true">Live Updates Connected</div>
  </header>

  <main>
    <section class="filters">
      <div class="filter-group">
        <label for="search">Search Product/SKU</label>
        <input id="search" type="text" [(ngModel)]="searchQuery" (input)="onFilterChange()" placeholder="Enter SKU or Name...">
      </div>
      <div class="filter-group">
        <label for="minQty">Min Quantity</label>
        <input id="minQty" type="number" [(ngModel)]="minQuantity" (input)="onFilterChange()" placeholder="0">
      </div>
    </section>

    <section class="warehouse-selector">
      <h3>Select Warehouse</h3>
      <div class="warehouse-grid">
        <div *ngFor="let w of warehouses$ | async" 
             class="warehouse-card" 
             [class.active]="w.id === selectedWarehouseId"
             (click)="onWarehouseSelect(w.id!)">
          <h4>{{w.name}}</h4>
          <p>{{w.location}}</p>
        </div>
      </div>
    </section>

    <section class="stock-display">
      <h3>Stock Levels</h3>
      <div *ngIf="stocks$ | async as stocks; else noStocks">
        <table>
          <thead>
            <tr>
              <th>Product ID</th>
              <th>Quantity</th>
              <th>Last Updated</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let s of stocks" class="stock-row">
              <td>{{s.productId}}</td>
              <td>
                <span class="quantity-badge" [class.low]="s.quantity < 10">
                  {{s.quantity}}
                </span>
              </td>
              <td>{{s.lastUpdated | date:'medium'}}</td>
            </tr>
          </tbody>
        </table>
      </div>
      <ng-template #noStocks>
        <p>No stocks available</p>
      </ng-template>
    </section>
  </main>
</div>
